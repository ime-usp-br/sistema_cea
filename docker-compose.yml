# Docker Compose compatível com deploy via Portainer a partir do repositório GitHub.
#
# Em desenvolvimento local, o compose interpola as variáveis do arquivo .env da raiz.
# No Portainer, defina os valores na seção "Environment variables" do Stack
# (não é necessário nem recomendado commitar o .env com segredos).
# Para produção, ajuste DJANGO_ENV=production, SECRET_KEY, ALLOWED_HOSTS e as credenciais do banco.

x-app-environment: &app-environment
  DJANGO_ENV: "${DJANGO_ENV:-development}"
  DEBUG: "${DEBUG:-True}"
  SECRET_KEY: "${SECRET_KEY:-django-insecure-change-me}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
  DATABASE_URL: "${DATABASE_URL:-postgres://uspuser:usppass@db:5432/uspdb}"
  REDIS_URL: "${REDIS_URL:-redis://redis:${REDIS_PORT:-6379}/0}"
  WEB_PORT: "${WEB_PORT:-8000}"
  ENABLE_LOCAL_LOGIN: "${ENABLE_LOCAL_LOGIN:-True}"
  GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
  SENHAUNICA_KEY: "${SENHAUNICA_KEY:-}"
  SENHAUNICA_SECRET: "${SENHAUNICA_SECRET:-}"
  SENHAUNICA_CALLBACK_ID: "${SENHAUNICA_CALLBACK_ID:-}"
  SENHAUNICA_ENV: "${SENHAUNICA_ENV:-prod}"

services:
  web:
    build: .
    restart: unless-stopped
    volumes:
      - staticfiles:/app/staticfiles
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - web

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-uspdb}"
      POSTGRES_USER: "${POSTGRES_USER:-uspuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-usppass}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uspuser} -d ${POSTGRES_DB:-uspdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "${REDIS_PORT:-6379}"
    networks:
      - default

  celery_worker:
    build: .
    command: celery -A core worker -l info
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default

networks:
  web:
    external: true

volumes:
  postgres_data:
  staticfiles:
