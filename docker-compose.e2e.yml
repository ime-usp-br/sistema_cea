# Stack descartável dos testes E2E de navegador (Playwright).
#
# Diferença em relação ao stack de desenvolvimento: aqui o app roda em um
# container próprio, com banco próprio e com Pix/Boleto simulados em memória,
# Celery em modo eager e e-mail gravado em arquivo. Nenhum teste depende de
# SMTP, webhook externo, SOAP ou do gateway Pix da USP.
#
# Uso recomendado:
#   ./scripts/run_e2e.sh
#
# Ou manualmente:
#   COMPOSE_PROJECT_NAME=sistema_cea_e2e \
#     docker compose -p sistema_cea_e2e -f docker-compose.e2e.yml up -d --build --wait
#   COMPOSE_PROJECT_NAME=sistema_cea_e2e \
#     docker compose -p sistema_cea_e2e -f docker-compose.e2e.yml run --rm e2e
#   docker compose -p sistema_cea_e2e -f docker-compose.e2e.yml down -v

x-e2e-app-environment: &e2e-app-environment
  DJANGO_ENV: development
  DEBUG: "True"
  # Mantém o relógio do container alinhado ao TIME_ZONE do app. Sem isto,
  # ``date.today()`` em comandos/testes pode ficar um dia à frente do app.
  TZ: America/Sao_Paulo
  SECRET_KEY: e2e-secret-key-not-for-production
  ALLOWED_HOSTS: "*"
  DATABASE_URL: postgres://e2e:e2e@db:5432/e2e
  # Stack descartável: host de serviço Compose é permitido apenas aqui.
  DB_ALLOW_LOCAL_HOST: "true"
  REDIS_URL: redis://redis:6379/0
  CACHE_URL: redis://redis:6379/1
  RATE_LIMIT_ENABLED: "True"
  RATE_LIMIT_WINDOW: "60"
  RATE_LIMIT_LOGIN: "5"
  RATE_LIMIT_WEBHOOK: "60"
  RATE_LIMIT_DOWNLOAD: "30"
  RATE_LIMIT_POST: "20"
  ENABLE_LOCAL_LOGIN: "True"
  # Gateways em memória: nenhuma chamada de rede.
  PAYMENT_GATEWAY_FAKE: "True"
  # Tarefas de notificação executam no processo (sem worker Celery).
  CELERY_TASK_ALWAYS_EAGER: "True"
  CELERY_TASK_EAGER_PROPAGATES: "True"
  # E-mail "desviado" para arquivos locais: os testes leem o link de
  # confirmação/reset pelo comando manage.py e2e_mailbox.
  EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
  EMAIL_FILE_PATH: /tmp/cea-e2e-mail
  MEDIA_ROOT: /tmp/cea-e2e-media
  DEFAULT_FROM_EMAIL: noreply@cea.e2e
  NOTIFICATION_CENTER_EMAIL: cea-e2e@example.com
  PIX_WEBHOOK_TOKEN: dev-webhook-token
  PIX_BASE_URL: fake://pix
  PIX_USERNAME: e2e
  PIX_PASSWORD: e2e
  BANK_SLIP_WSDL_URL: fake://boleto
  BANK_SLIP_USERNAME: e2e
  BANK_SLIP_PASSWORD: e2e
  # Senha Única via uspdev/senhaunica-faker (OAuth1 em memória, sem USP real).
  SENHAUNICA_KEY: e2e-key
  SENHAUNICA_SECRET: e2e-secret
  SENHAUNICA_CALLBACK_ID: "1"
  SENHAUNICA_ENV: dev
  SENHAUNICA_OAUTH_BASE_URL: http://senhaunica-faker:3141/wsusuario/oauth
  SENHAUNICA_LOGIN_REDIRECT_URL: /painel/
  # Authlib exige HTTPS por padrão; o faker roda em HTTP na rede interna E2E.
  AUTHLIB_INSECURE_TRANSPORT: "1"

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    environment: *e2e-app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      senhaunica-faker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/auth/login/', timeout=2)"
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  # Faker oficial da USPdev para o handshake OAuth1 da Senha Única.
  # Nunca é exposto fora da rede interna do compose.
  senhaunica-faker:
    image: uspdev/senhaunica-faker:1.0.3
    environment:
      APP_URL: http://senhaunica-faker:3141
      APP_ENV: local
      APP_DEBUG: "false"
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      FAKER_ALUNOGR: "1600001"
      FAKER_DOCENTE: "200001"
      FAKER_SERVIDOR: "100001"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:3141/ >/dev/null
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  e2e:
    build:
      context: ./e2e
    working_dir: /workspace
    depends_on:
      web:
        condition: service_healthy
    environment:
      # A aplicação sob teste é o serviço ``web`` desta mesma stack.
      E2E_BASE_URL: http://web:8000
      # O container de testes precisa usar o mesmo fuso do app.
      TZ: America/Sao_Paulo
      # Caminho absoluto do repositório no HOST: necessário porque os testes
      # executam comandos de management via socket do Docker.
      E2E_HOST_ROOT: "${E2E_HOST_ROOT:-.}"
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-sistema_cea_e2e}"
      E2E_APP_SERVICE: web
      E2E_COMPOSE_FILE: docker-compose.e2e.yml
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
