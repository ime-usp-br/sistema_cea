# Overlay OPCIONAL de desenvolvimento local (hot reload).
#
# NÃO faz parte do contrato de deploy e NÃO é usado pelo Portainer.
# Uso: make up-local
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Único overlay de desenvolvimento com bind mount de código; a porta publicada
# fica restrita a loopback. O banco continua externo (DB_HOST por domínio).

services:
  web:
    volumes:
      - .:/app
      - media:/app/media
      - backups:/app/backups
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:${WEB_PORT:-8000}"

  worker:
    volumes:
      - .:/app
      - media:/app/media
      - backups:/app/backups
