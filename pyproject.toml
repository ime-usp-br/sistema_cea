[tool.poetry]
name = "python-usp-starter-kit"
version = "0.1.0"
description = "A base oficial para desenvolvimento web e ciência de dados na USP."
authors = ["ayrtonnotrya <ayrtonnotrya@github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
senhaunica-socialite-python = {git = "https://github.com/ime-usp-br/senhaunica-socialite-python.git"}
replicado-python = {git = "https://github.com/ime-usp-br/replicado-python.git"}
django = "^5.2"
django-environ = "^0.12.0"
whitenoise = "^6.11.0"
psycopg = {extras = ["binary"], version = "^3.3.2"}
django-extensions = "^4.1"
gunicorn = "^23.0.0"
celery = "^5.3"
redis = "^5.0"

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
pytest-django = "*"
pytest-cov = "*"
django-stubs = "*"
faker = "^40.36.0"
factory-boy = "^3.3.3"

[tool.ruff]
target-version = "py314"
line-length = 119
src = ["apps"]
cache-dir = "/tmp/ruff_cache"
exclude = [
    "**/migrations/**",
    "**/staticfiles/**",
    ".venv",
    "venv",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
mypy_path = "apps"
explicit_package_bases = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
cache_dir = "/tmp/.mypy_cache"

[[tool.mypy.overrides]]
module = "senhaunica_socialite.*"
ignore_missing_imports = true

# Testes usam factory_boy (retornos não tipados de forma útil) e assertContain
# em context de respostas; a checagem estrita nesses módulos só gera ruído.
[[tool.mypy.overrides]]
module = ["*.tests", "*.tests.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
norecursedirs = ["e2e"]
addopts = "--cov=apps --cov-report=term-missing --reuse-db -p no:cacheprovider"

[tool.coverage.run]
data_file = "/tmp/.coverage"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
