[tool.poetry]
name = "sistema-cea"
version = "0.1.0"
description = "Sistema de Inscrições do CEA/IME-USP."
authors = ["ayrtonnotrya <ayrtonnotrya@github.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
senhaunica-socialite-python = {git = "https://github.com/ime-usp-br/senhaunica-socialite-python.git"}
replicado-python = {git = "https://github.com/ime-usp-br/replicado-python.git"}
django = "^5.2"
django-environ = "^0.12.0"
whitenoise = "^6.11.0"
psycopg = {extras = ["binary"], version = "^3.3.2"}
pymysql = "^1.2.4"
django-extensions = "^4.1"
gunicorn = "^23.0.0"
httpx = "^0.28.1"
weasyprint = "^66.0"
celery = "^5.3"
redis = "^5.0"
zeep = "^4.3.3"

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
pytest-django = "*"
pytest-cov = "*"
django-stubs = "*"
faker = "^40.36.0"
factory-boy = "^3.3.3"

[tool.ruff]
target-version = "py314"
line-length = 119
src = ["apps"]
cache-dir = "/tmp/ruff_cache"
exclude = [
    "**/migrations/**",
    "**/staticfiles/**",
    ".venv",
    "venv",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
mypy_path = "apps"
explicit_package_bases = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
cache_dir = "/tmp/.mypy_cache"
# Scripts descartáveis de diagnóstico em tmp/ não fazem parte do código do app.
exclude = ["^tmp/"]

[[tool.mypy.overrides]]
module = "senhaunica_socialite.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
norecursedirs = ["e2e", ".kilo", ".git", ".venv", "venv", "node_modules", "staticfiles"]
markers = [
    "slow: Testes mais lentos, executados na suíte completa/nightly.",
    "integration: Testes de integração entre camadas ou com o banco real.",
]
addopts = "--cov=apps --cov-report=term-missing -p no:cacheprovider"

[tool.coverage.run]
data_file = "/tmp/.coverage"
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/test_*.py",
    "*/factories.py",
]

[tool.coverage.report]
show_missing = true



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
