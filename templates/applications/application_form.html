{% extends "base/base.html" %}

{% block title %}Nova Inscrição{% endblock %}
{% block app_name %}Inscrições CEA{% endblock %}

{% block content %}
    <h1>Nova Inscrição</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar inscrição</button>
    </form>

    <p><a href="{% url 'applications:dashboard' %}">Voltar ao painel</a></p>
{% endblock %}
