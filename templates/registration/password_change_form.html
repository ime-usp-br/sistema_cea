{% extends "base/base.html" %}

{% block title %}Alterar senha | Inscrições CEA{% endblock %}
{% block app_name %}Inscrições CEA{% endblock %}

{% block content %}
<div class="card" style="max-width: 640px; margin: 0 auto;">
    <div class="card-body">
        <h1 class="page-title">Alterar senha</h1>
        <form method="post" novalidate class="form">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
